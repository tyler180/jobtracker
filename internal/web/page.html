<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job tracker</title>
<style>body{font:16px system-ui;max-width:1050px;margin:40px auto;padding:0 20px;background:#f5f5f2;color:#172b2a}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bac4c0;border-radius:8px;font:inherit}label{display:block;margin:12px 0}button{padding:12px 20px;background:#176b58;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}button.delete{background:#a43535}td select{min-width:180px}td select+select{margin-top:8px}article,form#save{background:white;border:1px solid #ddd;border-radius:12px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}a{color:#176b58}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}#message{min-height:24px}textarea{min-height:100px}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:14px}th,td{padding:8px}.table-wrap{overflow:auto}}</style>
<h1>Job tracker</h1><p>Track your applications and keep a local copy of each job description.</p>
<form id="save"><h2>Add application</h2><div class="grid"><label>Company name<input name="company" required maxlength="300" autocomplete="organization"></label><label>Job title<input name="title" required maxlength="300"></label></div><label>Job description URL<input name="url" type="url" required placeholder="Ashby, Greenhouse, or Workday posting URL"></label><div class="tracking"></div><button>Save application</button></form>
<p id="message" role="status" aria-live="polite"></p><h2>All applications</h2><label>Filter by status<select id="filter"><option value="">All statuses</option><option>applied</option><option>waiting for response</option><option>not moving forward</option><option>interview</option><option value="untracked">Saved posting only</option></select></label><div id="overview" class="table-wrap"></div><main id="jobs"></main>
<script>
const statuses=['applied','waiting for response','not moving forward','interview'], stages=['initial screening','round 1','round 2','round 3'];
const root=document.querySelector('#jobs'),message=document.querySelector('#message'),form=document.querySelector('#save');let jobs=[];
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function field(parent,label,name,value,type='input'){const l=el('label',label),n=el(type);n.name=name;n.value=value||'';l.append(n);parent.append(l);return n}
function select(parent,label,name,options,value){const n=field(parent,label,name,'','select');for(const v of options){const o=el('option',v||'Choose a stage');o.value=v;n.append(o)}n.value=value;return n}
function tracking(parent,a={}){const status=select(parent,'Application status','status',statuses,a.status||'applied');const interview=el('div');parent.append(interview);const stage=select(interview,'Interview stage','interview_stage',['',...stages],a.interview_stage||'');field(interview,'How the interview went','interview_notes',a.interview_notes,'textarea').maxLength=10000;field(interview,'Next steps','next_steps',a.next_steps,'textarea').maxLength=10000;function toggle(){interview.hidden=status.value!=='interview';stage.required=!interview.hidden}status.addEventListener('change',toggle);toggle()}
tracking(form.querySelector('.tracking'));
function link(text,href){const n=el('a',text);n.href=href;return n}
function render(){root.replaceChildren();const overview=document.querySelector('#overview');overview.replaceChildren();const filter=document.querySelector('#filter').value,rows=jobs.filter(j=>!filter||(j.application.status||'untracked')===filter);if(!rows.length){overview.append(el('p','No applications to show.'));return}const table=el('table'),head=el('tr');for(const h of ['Company','Job title','Current status','Description','Actions'])head.append(el('th',h));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');table.append(body);overview.append(table);
for(const j of rows){const a=j.application||{},row=el('tr');row.append(el('td',a.company||j.company),el('td',a.title||j.title));
const statusCell=el('td'),status=el('select');status.setAttribute('aria-label','Current status for '+(a.company||j.company)+' — '+(a.title||j.title));
if(!a.status){const placeholder=el('option','Saved posting only');placeholder.value='';placeholder.disabled=true;status.append(placeholder)}
for(const value of statuses){const option=el('option',value);option.value=value;status.append(option)}status.value=a.status||'';statusCell.append(status);
const stage=el('select');stage.setAttribute('aria-label','Interview stage for '+(a.company||j.company)+' — '+(a.title||j.title));for(const value of stages){const option=el('option',value);option.value=value;stage.append(option)}stage.value=a.interview_stage||'initial screening';stage.hidden=a.status!=='interview';statusCell.append(stage);row.append(statusCell);
async function updateStatus(){status.disabled=true;stage.disabled=true;try{await request('/api/jobs/'+j.id+'/application','PUT',{company:a.company||j.company,title:a.title||j.title,status:status.value,interview_stage:status.value==='interview'?stage.value:(a.interview_stage||''),interview_notes:a.interview_notes||'',next_steps:a.next_steps||''});await load();message.textContent='Application status updated.'}catch(e){status.value=a.status||'';stage.value=a.interview_stage||'initial screening';stage.hidden=a.status!=='interview';message.textContent=e.message}finally{status.disabled=false;stage.disabled=false}}
status.addEventListener('change',updateStatus);stage.addEventListener('change',updateStatus);
const td=el('td');td.append(link('Saved description','/jobs/'+j.id));row.append(td);
const actions=el('td'),remove=el('button','Delete');remove.type='button';remove.className='delete';remove.setAttribute('aria-label','Delete '+(a.company||j.company)+' — '+(a.title||j.title));remove.addEventListener('click',async()=>{if(!confirm('Delete '+(a.company||j.company)+' — '+(a.title||j.title)+'? This removes the application and its saved job description.'))return;remove.disabled=true;status.disabled=true;stage.disabled=true;try{await request('/api/jobs/'+j.id,'DELETE');await load();message.textContent='Job and saved description deleted.'}catch(e){message.textContent=e.message}finally{remove.disabled=false;status.disabled=false;stage.disabled=false}});actions.append(remove);row.append(actions);body.append(row);

const article=el('article');article.append(el('h3',(a.company||j.company)+' — '+(a.title||j.title)));const details=el('details');details.append(el('summary','Edit application details'));const edit=el('form');const company=field(edit,'Company name','company',a.company||j.company);company.required=true;company.maxLength=300;const title=field(edit,'Job title','title',a.title||j.title);title.required=true;title.maxLength=300;tracking(edit,a);const button=el('button','Save changes');edit.append(button);const feedback=el('p');feedback.setAttribute('role','status');edit.append(feedback);edit.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{await request('/api/jobs/'+j.id+'/application','PUT',Object.fromEntries(new FormData(edit)));await load();message.textContent='Application updated.'}catch(e){feedback.textContent=e.message}finally{button.disabled=false}});details.append(edit);article.append(details);root.append(article)}}
async function request(url,method,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return {data,status:r.status}}
async function load(){const r=await fetch('/api/jobs');if(!r.ok)throw Error('Could not load applications');jobs=await r.json();render()}
document.querySelector('#filter').addEventListener('change',render);
form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;message.textContent='Saving application and retrieving description…';try{const result=await request('/api/jobs','POST',Object.fromEntries(new FormData(form)));await load();message.textContent=result.status===201?'Application and description saved.':'This posting is already saved. Use Edit application details to update it.';if(result.status===201){form.reset();form.querySelector('[name=status]').dispatchEvent(new Event('change'))}}catch(e){message.textContent=e.message}finally{button.disabled=false}});load().catch(e=>message.textContent=e.message);
</script></html>
