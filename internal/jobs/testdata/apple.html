<html><script>window.__staticRouterHydrationData = JSON.parse("{\"loaderData\": {\"jobDetails\": {\"jobsData\": {\"jobNumber\": \"200682046\", \"postingTitle\": \"Senior Infrastructure SRE\", \"jobSummary\": \"Apple Cloud infrastructure is BIG. The storage SRE teams of Apple Cloud are building and running the next generation distributed storage systems to support Apple\\u2019s most critical services. Operating at our scale, across multiple geographically dispersed data centers, and servicing users with vast data need presents unique challenges. \\n\\n As a Storage SRE at Apple, you'll need to solve these problems using your deep understanding of storage, data analysis, programming, teamwork, and expertise in Linux system internals. Storage SREs at Apple involve themselves across the full infrastructure stack; from tuning the block storage layer to content delivery network traffic management.\", \"description\": \"We are looking for seasoned software and systems engineers to join the Storage SRE team at Apple. You are solution-oriented and have a passion for software delivered as a service to improve reuse, efficiency, and simplicity. Your work will affect hundreds of millions of users and be essential to the success of some of the most visible current and future Apple features.\\n\", \"responsibilities\": \"The role involves understanding the team's priorities; taking ownership of projects or deliverables; designing solutions and building buy-in for those designs; and successful and timely delivery of those designs. Members of our team are expected to be comfortable giving technical feedback to colleagues to assist them in the delivery of their designs, features and projects, as well as driving technical standards across the distributed team in collaboration with key stakeholders.\\nThe team has an on-call rota including the week-ends and the successful candidate should expect to handle alerts and other escalations in order to maintain a high level of availability and functionality for our provided services. The team is divided into two shards in UK and US and cross-timezone meetings are a core feature of how our team collaborates, reaches agreements, and executes to deliver projects.\\nAt Apple Cloud, we run a mix of open source, vendor licensed, and internally developed tools to perform functions such as system configuration management, provisioning, software development & deployment, logging, and monitoring. You'll learn these tools and have opportunities to improve them. We think critically and strive to balance\\nthe best solution with the need to get things done for each engineering challenge we face. Good ideas are heard and results are rewarded.\", \"minimumQualifications\": \"Bachelor's degree in Computer Science, Engineering, or equivalent practical experience\\n5+ years of experience in building, operating, and scaling distributed storage systems in a private, public, or hybrid cloud environment\\nThe ability to design, author, understand, and release code in languages like Go (preferred), Java, Python, or Rust.\\nGood understanding of block, object, and file storage solutions in Linux (such as LVM, XFS, ext4, S3, Ceph, Gluster, NFS)\\nUnderstanding of Linux internals, standard networking protocols, and distributed systems and experience with provisioning, data migration, backup & recovery, at-scale testing, disaster recovery, and capacity planning.\\nBachelor's Degree in Computer Science, an engineering-related field, or equivalent related experience. Advanced Degree preferred.\", \"preferredQualifications\": \"Hands-on experience managing large numbers of diverse systems with configuration management or software delivery platforms (such as Puppet, Chef, Ansible, and Spinnaker)\\nExperience with deploying, supporting and monitoring new and existing services, platforms, and application stacks\\nFamiliarity with microservices architecture and container orchestration with Kubernetes\\nFamiliarity with relational & non-relational databases (such as Cassandra, Postgres, & RocksDB)\", \"locations\": [{\"id\": \"postLocation-CUP\", \"name\": \"Cupertino\", \"city\": \"Cupertino\", \"code\": \"CUP\", \"stateProvince\": \"California\", \"metro\": \"San Francisco Bay Area\", \"countryName\": \"United States\", \"countryID\": \"iso-country-USA\", \"zipCode\": \"95014\", \"region\": \"West\", \"level\": 5, \"active\": true, \"postLocationCountryID\": \"postLocation-USA\", \"postingIdentifier\": \"0836\", \"showPayAndBenefits\": false, \"promotedOnLinkedIn\": false}], \"postingFooters\": [{\"postLocationId\": \"postLocation-CUP\", \"localizations\": {\"en_US\": [{\"displayOrder\": 1, \"name\": \"Pay & Benefits\", \"content\": \"At Apple, base pay is one part of our total compensation package and is determined within a range. This provides the opportunity to progress as you grow and develop within a role. The base pay range for this role is between $150,400 and $277,600, and your base pay will depend on your skills, qualifications, experience, and location.<br><br>Apple employees also have the opportunity to become an Apple shareholder through participation in Apple\\u2019s discretionary employee stock programs. Apple employees are eligible for discretionary restricted stock unit awards, and can purchase Apple stock at a discount if voluntarily participating in Apple\\u2019s Employee Stock Purchase Plan. You\\u2019ll also receive benefits including: Comprehensive medical and dental coverage, retirement benefits, a range of discounted products and free services, and for formal education related to advancing your career at Apple, reimbursement for certain educational expenses \\u2014 including tuition. Additionally, this role might be eligible for discretionary bonuses or commission payments as well as relocation. <a href='https://www.apple.com/careers/us/benefits.html' target='_blank' aria-label='Learn more about Apple Benefits (Opens in new window)'>Learn more about Apple Benefits<span class='icon icon-after icon-external' aria-hidden='true'></span></a><br><br>Note: Apple benefit, compensation and employee stock programs are subject to eligibility requirements and other terms of the applicable plan or program.<br>\", \"label\": \"Pay & Benefits\"}, {\"displayOrder\": 2, \"name\": \"EEO Statement\", \"content\": \"<p>Apple is an equal opportunity employer that is committed to inclusion and diversity. We seek to promote equal opportunity for all applicants without regard to race, color, religion, sex, sexual orientation, gender identity, national origin, disability, Veteran status, or other legally protected characteristics. <a href='https://www.eeoc.gov/sites/default/files/2023-06/22-088_EEOC_KnowYourRights6.12ScreenRdr.pdf' target='_blank' aria-label='Learn more about your EEO rights as an applicant (Opens PDF in new window)'>Learn more about your EEO rights as an applicant<span class='icon icon-after icon-external' aria-hidden='true'></span></a></p>\"}, {\"displayOrder\": 3, \"name\": \"Accessibility\", \"content\": \"<p>At Apple, we believe accessibility is a fundamental human right. You\\u2019ll find that idea reflected in everything here \\u2014 in our culture, our benefits and our digital tools. By welcoming as many perspectives as possible, we help you build a career where you feel like you belong.<br><br><a href='https://www.apple.com/careers/us/accessibility.html' target='_blank' aria-label='Learn about accessibility in Apple\\u2019s workplace (Opens in new window)' rel='noopener noreferrer'>Learn about accessibility in Apple\\u2019s workplace<span class='icon icon-after icon-external' aria-hidden='true'></span></a><br><br><a href='https://www.apple.com/careers/us/accommodation.html' aria-label='Learn about reasonable accommodations for job applicants (Opens in new window)' target='_blank' rel='noopener noreferrer'>Learn about reasonable accommodations for job applicants<span class='icon icon-after icon-external' aria-hidden='true'></span></a></p>\"}, {\"displayOrder\": 4, \"name\": \"Application Deadline\", \"content\": \"<p>Apple accepts applications to this posting on an ongoing basis.</p>\"}]}}], \"selectedLocale\": \"en_US\"}}}}");</script></html>
