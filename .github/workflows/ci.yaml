name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/jobtracker
      - run: docker build -t jobtracker:test .
      - name: Verify GitOps proposal generator
        run: |
          python3 -m venv "$RUNNER_TEMP/manifest-tests"
          "$RUNNER_TEMP/manifest-tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/manifest-tests/bin/python" -m unittest discover -s automation/tests
